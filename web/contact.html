<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liên hệ &amp; nhận đồ – WANDERENT</title>
  <link rel="icon" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="container prose-page">
    <nav class="breadcrumb"><a href="index.html">Trang chủ</a><span>/</span><span>Liên hệ</span></nav>
    <h1>Nhận đồ ở đâu, khi nào?</h1>
    <div class="info-card">
      <h3 data-store="name"></h3>
      <p data-store="address"></p>
      <p>Giờ nhận/trả: <strong data-store="hours"></strong></p>
      <p>Điện thoại: <a data-store="phone-link"></a> · Email: <a data-store="email-link"></a></p>
      <p><a class="btn btn-primary" data-store="map-link" href="#" target="_blank" rel="noopener">Mở bản đồ</a></p>
    </div>
    <h2>Giao tận nơi</h2>
    <p>Nội thành TP.HCM, phí <strong data-store="delivery-fee"></strong>/lượt giao (chiều nhận). Trả đồ có thể mang lại điểm Thủ Đức hoặc đặt chiều trả (thêm <span data-store="delivery-fee"></span>).</p>
    <iframe title="Bản đồ điểm nhận đồ" src="https://maps.google.com/maps?q=Đại%20học%20Kinh%20tế%20Luật%20TP.HCM&output=embed" width="100%" height="320" style="border:0;border-radius:14px;margin-top:12px" loading="lazy"></iframe>
  </main>
  <footer id="site-footer"></footer>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/page.js"></script>
</body>
