<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thanh toán cọc – WANDERENT</title>
  <link rel="icon" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="index.html">Trang chủ</a><span aria-hidden="true">/</span>
      <a href="cart.html">Giỏ thuê</a><span aria-hidden="true">/</span>
      <span aria-current="page">Thanh toán cọc</span>
    </nav>
    <h1 class="section-title" style="margin-bottom:12px">Thanh toán cọc &amp; nhận đồ</h1>
    <ol class="checkout-steps" aria-label="Các bước đặt thuê">
      <li class="done"><a href="cart.html">Giỏ thuê</a></li>
      <li class="cur" aria-current="step">Thông tin &amp; nhận đồ</li>
      <li>Thanh toán cọc</li>
      <li>Hoàn tất</li>
    </ol>
    <form class="check-layout" id="checkout-form" novalidate>
      <div>
        <section class="form-card co-card">
          <h2><span class="co-num">1</span>Người thuê</h2>
          <div id="renter-box"></div>
        </section>
        <section class="form-card co-card">
          <h2><span class="co-num">2</span>Nhận đồ ở đâu?</h2>
          <div class="fulfill-opts">
            <label class="radio-card"><input type="radio" name="fulfill" value="pickup" checked>
              <span><strong>Nhận tại cửa hàng</strong> <em class="free">Miễn phí</em><br><small><span data-store="address"></span> · <span data-store="hours"></span></small></span>
            </label>
            <label class="radio-card"><input type="radio" name="fulfill" value="delivery">
              <span><strong>Giao tận nơi trong TP.HCM</strong> <em>+ <span data-store="delivery-fee"></span></em><br><small>Giao trong khung <span data-store="hours"></span></small></span>
            </label>
          </div>
          <div id="addr-box" hidden></div>
          <div class="field" style="margin-top:12px"><label for="c-note">Ghi chú cho cửa hàng (không bắt buộc)</label><textarea id="c-note" placeholder="VD: nhận lúc 9:00, cần hướng dẫn dựng lều"></textarea></div>
        </section>
        <section class="form-card co-card">
          <h2><span class="co-num">3</span>Cách thanh toán cọc</h2>
          <div class="pay-opts">
            <label class="radio-card pay-opt"><input type="radio" name="pay" value="momo" checked>
              <span class="pay-logo momo">MoMo</span><span><strong>Ví MoMo</strong><br><small>Quét mã QR bằng ứng dụng MoMo</small></span></label>
            <label class="radio-card pay-opt"><input type="radio" name="pay" value="transfer">
              <span class="pay-logo bank">VCB</span><span><strong>Chuyển khoản ngân hàng</strong><br><small>Quét VietQR hoặc chuyển theo số tài khoản</small></span></label>
            <label class="radio-card pay-opt"><input type="radio" name="pay" value="card">
              <span class="pay-logo card">VISA</span><span><strong>Thẻ ATM nội địa / Visa / Mastercard</strong><br><small>Nhập thông tin thẻ, xác thực OTP</small></span></label>
          </div>
          <p class="meta" style="margin-top:8px">Bản demo học thuật: không trừ tiền thật.</p>
        </section>
      </div>
      <aside class="summary-box co-sum" id="pay-sum" aria-live="polite"></aside>
    </form>
  </main>
  <footer id="site-footer"></footer>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/checkout.js"></script>
</body>
</html>
