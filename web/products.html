<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thuê thiết bị – WANDERENT</title>
  <meta name="description" content="Danh sách lều, túi ngủ, ván SUP, bếp dã ngoại cho thuê theo ngày tại WANDERENT.">
  <link rel="icon" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="index.html">Trang chủ</a><span aria-hidden="true">/</span>
          <span aria-current="page" id="bc-current">Thuê thiết bị</span>
        </nav>
        <h1 id="page-title">Thuê thiết bị</h1>
        <p id="page-sub">Lều, túi ngủ, ván SUP và bếp dã ngoại. Chọn ngày để xem đồ còn trống.</p>

        <!-- Chọn ngày thuê: lưu lại để mang sang trang chi tiết -->
        <form class="rent-dates" id="rent-dates" onsubmit="return false">
          <div class="date-field">
            <label for="rd-from">Ngày nhận</label>
            <input id="rd-from" type="date">
          </div>
          <div class="date-field">
            <label for="rd-to">Ngày trả</label>
            <input id="rd-to" type="date">
          </div>
          <p class="days-note" id="days-note" aria-live="polite"></p>
        </form>
      </div>
    </section>

    <div class="container shop-layout">
      <!-- ============ BỘ LỌC ============ -->
      <aside class="filters" aria-label="Bộ lọc">
        <div class="filter-group filter-search">
          <h3><label for="f-search">Tìm trong danh sách</label></h3>
          <input id="f-search" type="search" placeholder="VD: Naturehike, 4 người...">
        </div>
        <div class="filter-group">
          <h3>Danh mục</h3>
          <ul class="cat-filter" id="cat-filter"></ul>
        </div>
        <div class="filter-group">
          <h3>Giá thuê / ngày</h3>
          <div id="rent-filter">
            <label class="check"><input type="radio" name="rent" value="" checked> Tất cả</label>
            <label class="check"><input type="radio" name="rent" value="0-50000"> Dưới 50.000đ</label>
            <label class="check"><input type="radio" name="rent" value="50000-150000"> 50.000 – 150.000đ</label>
            <label class="check"><input type="radio" name="rent" value="150000-300000"> 150.000 – 300.000đ</label>
            <label class="check"><input type="radio" name="rent" value="300000-999999999"> Trên 300.000đ</label>
          </div>
          <p class="filter-note">Thuê nhiều ngày được giảm: từ ngày 2 còn 80%, từ ngày 4 còn 60%.</p>
        </div>
        <div class="filter-group">
          <h3>Tuỳ chọn</h3>
          <label class="check"><input type="checkbox" id="f-colors"> Có nhiều màu để chọn</label>
        </div>
      </aside>

      <!-- ============ DANH SÁCH ============ -->
      <section class="shop-main" aria-labelledby="page-title">
        <div class="toolbar">
          <p class="result-count" id="result-count" aria-live="polite"></p>
          <label class="date-field" style="flex-direction:row;align-items:center;gap:8px">
            <span style="font-size:14px;color:var(--xam);font-weight:600">Sắp xếp</span>
            <select id="f-sort">
              <option value="">Mặc định</option>
              <option value="rent-asc">Giá thuê tăng dần</option>
              <option value="rent-desc">Giá thuê giảm dần</option>
              <option value="name">Tên A → Z</option>
            </select>
          </label>
        </div>
        <div class="chips" id="chips"></div>
        <div class="product-grid" id="product-grid"></div>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/products.js"></script>
</body>
</html>
